version: '3.8'

services:
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: billing_valkey
    ports:
      - "${VALKEY_PORT}:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: billing_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest